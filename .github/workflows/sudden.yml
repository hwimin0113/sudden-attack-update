
name: Sudden Attack Update

on:
  schedule:
    - cron: "*/30 * * * *"

  workflow_dispatch:
    inputs:
      test_mode:
        description: "최신 업데이트 강제 테스트"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sudden-attack-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Check Sudden Attack updates
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          TEST_MODE: ${{ inputs.test_mode && '1' || '0' }}
          HEADLESS: "1"
        run: python sudden_update.py

      - name: Save update state
        if: success()
        run: |
          if [ -n "$(git status --porcelain last_update.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add last_update.json
            git commit -m "Save latest Sudden Attack update"
            git push
          fi
